<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三盛公司派車登記系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Noto+Sans+Khmer:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --p:#1d4ed8;--pl:#3b82f6;--pd:#1e3a8a;--pbg:#eff6ff;
  --ok:#10b981;--okbg:#ecfdf5;
  --err:#ef4444;--errbg:#fef2f2;
  --warn:#f59e0b;--warnbg:#fffbeb;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;
  --w:#fff;--r:8px;--rl:12px;--rxl:18px;
  --sh:0 1px 3px rgba(0,0,0,.1);--sh2:0 4px 6px rgba(0,0,0,.07);--sh4:0 20px 25px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;background:var(--g50);color:var(--g800);font-size:14px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--g100);}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:99px;}
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1d4ed8,#1e3a8a 50%,#0f172a);}
.login-card{background:var(--w);border-radius:var(--rxl);padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--sh4);animation:cardIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:none;}}
.lc-logo{text-align:center;margin-bottom:20px;}
.lc-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--p),var(--pd));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;box-shadow:0 8px 20px rgba(29,78,216,.3);}
.lc-title{font-size:18px;font-weight:800;color:var(--g900);line-height:1.3;}
.lc-sub{font-size:12px;color:var(--g500);margin-top:4px;}
.lang-row{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
.lang-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--g200);background:var(--w);cursor:pointer;font-size:12px;font-weight:600;color:var(--g500);transition:all .15s;font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;}
.lang-btn:hover{border-color:var(--pl);color:var(--p);}
.lang-btn.on{border-color:var(--p);background:var(--pbg);color:var(--p);}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.rt{padding:10px 8px;border-radius:var(--r);border:2px solid var(--g200);background:var(--w);cursor:pointer;text-align:center;transition:all .15s;font-weight:600;font-size:12px;color:var(--g500);}
.rt:hover{border-color:var(--pl);color:var(--p);}
.rt.on{border-color:var(--p);background:var(--pbg);color:var(--p);}
.rt-ico{font-size:20px;display:block;margin-bottom:4px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.fg label{font-size:11px;font-weight:700;color:var(--g700);}
.iw{position:relative;}
.ii{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--g400);pointer-events:none;}
.fi{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:14px;font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;transition:all .15s;outline:none;background:var(--w);}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(29,78,216,.08);}
.lerr{display:none;background:var(--errbg);border:1px solid #fca5a5;border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--err);margin-bottom:12px;}
.lerr.show{display:block;}
.lbtn{width:100%;padding:12px;border-radius:var(--r);border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;background:linear-gradient(135deg,var(--p),var(--pd));color:var(--w);transition:all .15s;box-shadow:0 4px 12px rgba(29,78,216,.25);margin-top:6px;}
.lbtn:hover{transform:translateY(-1px);}
.lbtn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.lhint{text-align:center;font-size:11px;color:var(--g400);margin-top:16px;line-height:1.9;}
.lhint code{background:var(--g100);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;}
#app{display:none;min-height:100vh;}
#app.show{display:block;}
.topbar{background:linear-gradient(90deg,#1d4ed8,#1e3a8a);color:var(--w);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.tb-l{display:flex;align-items:center;gap:10px;}
.tb-logo{font-size:16px;font-weight:800;}
.tb-badge{background:rgba(255,255,255,.15);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.tb-r{display:flex;align-items:center;gap:8px;}
.tb-user{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:var(--r);padding:4px 10px;font-size:12px;font-weight:500;}
.tb-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;}
.tb-btn{padding:5px 12px;border-radius:var(--r);border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--w);font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.tb-btn:hover{background:rgba(255,255,255,.15);}
.tb-lang{display:flex;gap:4px;}
.tb-lang button{padding:3px 8px;border-radius:var(--r);border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:11px;cursor:pointer;font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;}
.tb-lang button.on{background:rgba(255,255,255,.2);color:var(--w);}
.subnav{background:var(--w);border-bottom:1px solid var(--g200);display:flex;padding:0 22px;position:sticky;top:54px;z-index:90;overflow-x:auto;}
.subnav::-webkit-scrollbar{display:none;}
.sn{padding:12px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--g500);white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px;}
.sn:hover{color:var(--p);}
.sn.active{border-bottom-color:var(--p);color:var(--p);}
.sn-dot{background:var(--err);color:var(--w);font-size:9px;font-weight:700;padding:1px 5px;border-radius:20px;}
.content{padding:22px;max-width:1380px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}
.card{background:var(--w);border-radius:var(--rl);box-shadow:var(--sh);border:1px solid var(--g100);}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;color:var(--g900);display:flex;align-items:center;gap:6px;}
.card-body{padding:18px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.stat{background:var(--w);border-radius:var(--rl);padding:16px;border:1px solid var(--g100);box-shadow:var(--sh);position:relative;overflow:hidden;transition:all .15s;}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2);}
.stat-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.07;}
.stat-lbl{font-size:10px;color:var(--g500);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.stat-val{font-size:26px;font-weight:900;margin:4px 0 2px;font-family:'JetBrains Mono',monospace;}
.stat-sub{font-size:11px;color:var(--g400);}
.c-blue{color:var(--p);}.c-green{color:var(--ok);}.c-amber{color:var(--warn);}.c-red{color:var(--err);}
.ff{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.ff label{font-size:11px;font-weight:700;color:var(--g700);}
.ffi,.ffs,.ffta{padding:9px 11px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:13px;font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;transition:all .15s;outline:none;background:var(--w);color:var(--g900);width:100%;}
.ffi:focus,.ffs:focus,.ffta:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(29,78,216,.08);}
.ffta{resize:vertical;min-height:68px;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.cb-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.cbi{display:flex;align-items:center;gap:5px;background:var(--g50);border:1.5px solid var(--g200);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:500;color:var(--g700);transition:all .15s;user-select:none;}
.cbi:hover{border-color:var(--pl);color:var(--p);}
.cbi.on{background:var(--pbg);border-color:var(--p);color:var(--p);}
.cbck{width:13px;height:13px;border:2px solid var(--g300);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.cbi.on .cbck{background:var(--p);border-color:var(--p);}
.cbi.on .cbck::after{content:'✓';font-size:8px;color:white;font-weight:800;}
.btn{padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Noto Sans TC','Noto Sans Khmer',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-p{background:var(--p);color:var(--w);}
.btn-p:hover{background:var(--pd);}
.btn-ok{background:var(--ok);color:var(--w);}
.btn-err{background:var(--err);color:var(--w);}
.btn-ghost{background:var(--g100);color:var(--g700);}
.btn-ghost:hover{background:var(--g200);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-lg{padding:11px 20px;font-size:14px;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{border-bottom:2px solid var(--g100);}
thead th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--g500);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--g50);transition:background .1s;}
tbody tr:hover{background:var(--g50);}
tbody td{padding:10px 12px;color:var(--g700);vertical-align:middle;}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.tag-pending{background:var(--warnbg);color:#92400e;}
.tag-approved{background:var(--okbg);color:var(--ok);}
.tag-rejected{background:var(--errbg);color:var(--err);}
.tag-completed{background:var(--g100);color:var(--g500);}
.tag-blue{background:var(--pbg);color:var(--p);}
.tag-green{background:var(--okbg);color:var(--ok);}
.rc{background:var(--w);border:1px solid var(--g100);border-radius:var(--rl);padding:13px 15px;transition:all .15s;margin-bottom:8px;}
.rc:hover{border-color:var(--g200);box-shadow:var(--sh2);}
.rc.exp{border-color:var(--pl);}
.rc-hdr{display:flex;justify-content:space-between;align-items:flex-start;}
.rc-acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;}
.rc-det{margin-top:11px;padding-top:11px;border-top:1px solid var(--g100);display:none;}
.rc-det.show{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.rdi label{font-size:10px;color:var(--g400);font-weight:700;}
.rdi p{font-size:12px;color:var(--g800);font-weight:500;margin-top:1px;}
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.siw{position:relative;flex:1;min-width:160px;}
.si-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--g400);pointer-events:none;}
.si{padding:7px 10px 7px 30px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:12px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:all .15s;width:100%;background:var(--w);}
.si:focus{border-color:var(--p);}
.fsel{padding:7px 10px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:12px;font-family:'Noto Sans TC',sans-serif;outline:none;min-width:110px;background:var(--w);}
.stg-g{display:grid;grid-template-columns:200px 1fr;gap:18px;}
.stg-nav{display:flex;flex-direction:column;gap:1px;}
.stg-ni{padding:8px 12px;border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:500;color:var(--g600);transition:all .15s;display:flex;align-items:center;gap:7px;}
.stg-ni:hover{background:var(--g100);color:var(--g900);}
.stg-ni.active{background:var(--pbg);color:var(--p);font-weight:700;}
.dr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--g100);}
.dr:last-child{border-bottom:none;}
.dr-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.dr-body{flex:1;min-width:0;}
.dr-name{font-size:13px;font-weight:600;color:var(--g900);}
.dr-sub{font-size:11px;color:var(--g500);margin-top:1px;}
.dr-acts{display:flex;gap:4px;flex-shrink:0;}
.ie{background:var(--g50);border:1.5px solid var(--pl);border-radius:var(--rl);padding:13px;margin:7px 0;}
.ie-ttl{font-size:11px;font-weight:700;color:var(--p);margin-bottom:9px;}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pbg);border:1px solid #bfdbfe;border-radius:20px;padding:3px 10px;font-size:12px;color:var(--p);font-weight:500;}
.chip-x{background:none;border:none;cursor:pointer;color:#93c5fd;font-size:12px;line-height:1;padding:0;}
.chip-x:hover{color:var(--err);}
.chip-add{display:flex;gap:6px;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal{background:var(--w);border-radius:var(--rxl);max-width:500px;width:100%;box-shadow:var(--sh4);animation:mIn .2s ease;max-height:90vh;overflow-y:auto;}
@keyframes mIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:none;}}
.modal-hdr{padding:16px 20px 13px;border-bottom:1px solid var(--g100);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--w);}
.modal-ttl{font-size:15px;font-weight:700;}
.modal-x{background:var(--g100);border:none;cursor:pointer;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--g500);}
.modal-body{padding:16px 20px;}
.modal-foot{padding:13px 20px;border-top:1px solid var(--g100);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--w);}
.loader{position:fixed;inset:0;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#toasts{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--g900);color:var(--w);border-radius:var(--r);padding:10px 15px;font-size:12px;font-weight:500;min-width:220px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh4);animation:tIn .3s ease;}
@keyframes tIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}
.toast.ok{background:var(--ok);}.toast.err{background:var(--err);}
.empty{text-align:center;padding:44px 18px;color:var(--g400);}
.empty-ico{font-size:40px;margin-bottom:10px;opacity:.5;}
.chart-bar{height:180px;display:flex;align-items:flex-end;gap:8px;padding:10px 0;}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-fill{width:100%;background:var(--p);border-radius:4px 4px 0 0;min-height:4px;}
.bar-lbl{font-size:10px;color:var(--g500);text-align:center;}
.bar-val{font-size:10px;color:var(--g700);font-weight:700;font-family:'JetBrains Mono',monospace;}
.km-box{background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--r);padding:12px 14px;margin-top:10px;}
.km-box-title{font-size:11px;font-weight:700;color:var(--g600);margin-bottom:8px;}
@media(max-width:768px){.content{padding:14px;}.g2,.g3,.g4{grid-template-columns:1fr;}.stg-g{grid-template-columns:1fr;}.fg2,.fg3{grid-template-columns:1fr;}.rc-det.show{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
  <div id="login-page">
  <div class="login-card">
    <div class="lc-logo">
      <div class="lc-icon">🚛</div>
      <div class="lc-title" id="lc-title">三盛公司派車登記系統</div>
      <div class="lc-sub" id="lc-sub">SUN HSU VEHICLE DISPATCH</div>
    </div>
    <div class="lang-row">
      <button class="lang-btn on" id="lb-zh" data-lang="zh">中文</button>
      <button class="lang-btn" id="lb-en" data-lang="en">English</button>
      <button class="lang-btn" id="lb-km" data-lang="km">ខ្មែរ</button>
    </div>
    <div class="role-tabs">
      <div class="rt on" id="rt-admin"><span class="rt-ico">🛡️</span><span id="rt-admin-lbl">管理員</span></div>
      <div class="rt" id="rt-user"><span class="rt-ico">👤</span><span id="rt-user-lbl">申請人員</span></div>
    </div>
    <div class="lerr" id="lerr"></div>
    <div class="fg"><label id="lbl-user">帳號</label><div class="iw"><span class="ii">👤</span><input class="fi" id="lu" type="text" placeholder="請輸入帳號" autocomplete="username"></div></div>
    <div class="fg"><label id="lbl-pass">密碼</label><div class="iw"><span class="ii">🔒</span><input class="fi" id="lp" type="password" placeholder="請輸入密碼" autocomplete="current-password"></div></div>
    <button class="lbtn" id="lbtn">登入系統</button>
    <div class="lhint">管理員: <code>admin / admin123</code> &nbsp; 申請人員: <code>user1 / user123</code></div>
  </div>
</div>
<div id="app">
  <nav class="topbar">
    <div class="tb-l"><span style="font-size:18px">🚛</span><span class="tb-logo" id="tb-title">三盛公司派車登記系統</span><span class="tb-badge" id="tb-role">管理員</span></div>
    <div class="tb-r">
      <div class="tb-lang" id="tb-lang"></div>
      <div class="tb-user"><div class="tb-av" id="tb-av"></div><span id="tb-name"></span></div>
      <button class="tb-btn" id="logout-btn">登出</button>
    </div>
  </nav>
  <div class="subnav" id="subnav"></div>
  <div class="content">
    <div id="pg-dashboard" class="page">
      <div class="g4" id="stats-row"></div>
      <div class="g2" style="margin-bottom:16px">
        <div class="card"><div class="card-hdr"><span class="card-title" id="dash-today-title">📋 今日派車申請</span><button class="btn btn-ghost btn-sm" id="view-all-btn">查看全部</button></div><div class="tw"><table><thead><tr><th id="th-time">時間</th><th id="th-req">申請人</th><th id="th-route">路線</th><th id="th-status">狀態</th></tr></thead><tbody id="today-table"></tbody></table></div></div>
        <div class="card"><div class="card-hdr"><span class="card-title" id="dash-month-title">📊 本月統計</span></div><div class="card-body" id="month-stats"></div></div>
      </div>
      <div class="card"><div class="card-hdr"><span class="card-title">🚛 車輛動態總覽</span><button class="btn btn-ghost btn-sm" id="dash-veh-refresh">🔄 更新</button></div><div class="card-body"><div id="dash-veh-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px"></div></div></div>
    </div>
    <div id="pg-apply" class="page">
      <div class="g2">

async function submitApply(){var types=Array.from(document.querySelectorAll('.cbi.on')).map(function(e){return e.dataset.val;});if(!types.length){toast(T('dtype')+'?','err');return;}var date=g('f-date').value,time=g('f-time').value,start=g('f-start').value.trim(),dest=g('f-dest').value.trim(),reason=g('f-reason').value.trim(),req=g('f-req').value.trim();if(!date||!time||!start||!dest||!reason||!req){toast('請填寫所有必填欄位','err');return;}var btn=g('submit-btn');btn.disabled=true;btn.textContent='...';var ref=genRef(),status=CU.role==='admin'?'approved':'pending';var selVeh=g('f-vtype')?g('f-vtype').value:'';try{var r=await sb.from('dispatch_requests').insert({request_no:ref,requester_id:CU.id,dispatch_types:JSON.stringify(types),vehicle_type:selVeh||'',dispatch_date:date,dispatch_time:time,start_location:start,destination:dest,passengers:parseInt(g('f-pax').value)||1,reason:reason,notes:g('f-notes').value.trim(),status:status,approved_by:status==='approved'?CU.id:null,approved_at:status==='approved'?new Date().toISOString():null});if(r.error)throw r.error;toast('✅ '+ref+' '+T('submit'),'ok');resetForm();loadRecent();updatePendingBadge();var tgMsg='🔔 <b>新派車申請 #'+ref+'</b>\n👤 申請人：'+req+'\n📋 種類：'+types.join(', ')+'\n📅 日期：'+date+' '+time+'\n📍 路線：'+start+' → '+dest+(selVeh?'\n🚗 指定車輛：'+selVeh:'')+'\n📝 原因：'+reason+'\n狀態：'+(status==='approved'?'✅ 已核准（管理員提交）':'⏳ 待審核');sendTelegram(tgMsg);if(status==='pending'&&EMAIL_CFG.admin_email)sendEmail(EMAIL_CFG.admin_email,'新派車申請 '+ref,'申請人：'+req+'\n種類：'+types.join(', ')+'\n日期：'+date+' '+time+'\n路線：'+start+' → '+dest+'\n原因：'+reason);if(CU.email)sendEmail(CU.email,'派車申請已送出 '+ref,'您的申請 '+ref+' 已送出。\n路線：'+start+' → '+dest+'\n日期：'+date+' '+time);}catch(e){toast('Error: '+e.message,'err');}btn.disabled=false;btn.textContent=T('submit');}

async function renderReport(){var yr=g('rpt-year').value,mo=String(g('rpt-month').value).padStart(2,'0');var prefix=yr+'-'+mo;showLoader('載入報表...');try{var r=await sb.from('dispatch_requests').select('*,users!requester_id(name)').gte('dispatch_date',prefix+'-01').lte('dispatch_date',prefix+'-31').order('dispatch_date');var data=r.data||[];var totalKm=0,totalCost=0,byType={},byDriver={};data.forEach(function(rec){if(rec.km_driven)totalKm+=rec.km_driven;var types=[];try{types=JSON.parse(rec.dispatch_types);}catch(e){types=[rec.dispatch_types];}types.forEach(function(t){byType[t]=(byType[t]||0)+1;});var dname=rec.users?rec.users.name:'未知';byDriver[dname]=(byDriver[dname]||0)+1;});var r2=await sb.from('vehicles').select('plate,fuel_rate');var rateMap={};(r2.data||[]).forEach(function(v){rateMap[v.plate]=v.fuel_rate||10;});data.forEach(function(rec){if(rec.km_driven){var rate=rateMap[rec.vehicle_type]||10;totalCost+=parseFloat(calcFuelCost(rec.km_driven,rate)||0);}});var maxBar=Math.max.apply(null,Object.values(byType).concat([1]));g('rpt-content').innerHTML='<div class="g4" style="margin-bottom:16px"><div class="stat"><div class="stat-lbl">總派車次數</div><div class="stat-val c-blue">'+data.length+'</div><div class="stat-sub">'+yr+'年'+parseInt(mo)+'月</div><div class="stat-ico">📊</div></div><div class="stat"><div class="stat-lbl">總行駛里程</div><div class="stat-val c-green">'+totalKm.toLocaleString()+'</div><div class="stat-sub">公里</div><div class="stat-ico">🛣️</div></div><div class="stat"><div class="stat-lbl">預估油耗費用</div><div class="stat-val c-amber">$'+totalCost.toFixed(2)+'</div><div class="stat-sub">USD ($'+FUEL_PRICE+'/L)</div><div class="stat-ico">⛽</div></div><div class="stat"><div class="stat-lbl">使用員工數</div><div class="stat-val c-red">'+Object.keys(byDriver).length+'</div><div class="stat-sub">位員工使用</div><div class="stat-ico">👥</div></div></div><div class="g2"><div class="card"><div class="card-hdr"><span class="card-title">🏷️ 派車種類分布</span></div><div class="card-body"><div class="chart-bar">'+Object.entries(byType).map(function(kv){var h=maxBar?Math.max(20,Math.round(kv[1]/maxBar*150)):20;return '<div class="bar-item"><div class="bar-val">'+kv[1]+'</div><div class="bar-fill" style="height:'+h+'px"></div><div class="bar-lbl">'+kv[0]+'</div></div>';}).join('')+'</div></div></div><div class="card"><div class="card-hdr"><span class="card-title">👤 各員工派車次數</span></div><div class="card-body">'+Object.entries(byDriver).sort(function(a,b){return b[1]-a[1];}).map(function(kv){return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px"><span>'+kv[0]+'</span><span class="tag tag-blue">'+kv[1]+'次</span></div>';}).join('')+'</div></div></div><div class="card" style="margin-top:16px"><div class="card-hdr"><span class="card-title">📋 本月派車明細</span></div><div class="tw"><table><thead><tr><th>編號</th><th>日期</th><th>申請人</th><th>路線</th><th>車輛</th><th>里程(km)</th><th>油耗費(USD)</th><th>狀態</th></tr></thead><tbody>'+data.map(function(rec){var cost=rec.km_driven?(calcFuelCost(rec.km_driven,rateMap[rec.vehicle_type]||10)||'—'):'—';return '<tr><td style="font-family:monospace;font-size:11px">'+rec.request_no+'</td><td>'+rec.dispatch_date+'</td><td>'+(rec.users?rec.users.name:'')+'</td><td style="font-size:12px">'+rec.start_location+' → '+rec.destination+'</td><td style="font-size:11px">'+(rec.vehicle_type||'—')+'</td><td style="text-align:center">'+(rec.km_driven||'—')+'</td><td style="text-align:center">$'+cost+'</td><td>'+stTag(rec.status)+'</td></tr>';}).join('')+'</tbody></table></div></div>';}catch(e){g('rpt-content').innerHTML='<p style="color:var(--err)">載入失敗: '+e.message+'</p>';}hideLoader();}
async function exportReport(){var yr=g('rpt-year').value,mo=String(g('rpt-month').value).padStart(2,'0');var prefix=yr+'-'+mo;var r=await sb.from('dispatch_requests').select('*,users!requester_id(name,phone)').gte('dispatch_date',prefix+'-01').lte('dispatch_date',prefix+'-31').order('dispatch_date');if(!r.data||!r.data.length){toast('沒有資料','err');return;}var rows=[['編號','日期','時間','申請人','電話','種類','車輛','出發地','目的地','人數','原因','出廠km','回廠km','行駛km','狀態']];r.data.forEach(function(rec){var types='';try{types=JSON.parse(rec.dispatch_types).join('+');}catch(e){types=rec.dispatch_types;}rows.push([rec.request_no,rec.dispatch_date,rec.dispatch_time,rec.users?rec.users.name:'',rec.users?rec.users.phone||'':'',types,rec.vehicle_type||'',rec.start_location,rec.destination,rec.passengers,(rec.reason||'').replace(/,/g,'，'),rec.km_out||'',rec.km_in||'',rec.km_driven||'',rec.status]);});var csv='\uFEFF'+rows.map(function(row){return row.map(function(c){return '"'+c+'"';}).join(',');}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='月報表_'+prefix+'.csv';a.click();toast('✅ 月報表已匯出','ok');}

function renderSiteInfo(){g('stg-content').innerHTML='<div class="card"><div class="card-hdr"><span class="card-title">🏭 網站基本資訊</span></div><div class="card-body"><div class="ff"><label>系統名稱</label><input class="ffi" id="si-name" value="'+CONFIG.site_name+'"></div><button class="btn btn-p" id="save-si-btn">💾 儲存並套用</button></div></div>';g('save-si-btn').onclick=async function(){var name=g('si-name').value.trim();if(!name)return;await sb.from('system_config').upsert({key:'site_name',value:JSON.stringify(name)});CONFIG.site_name=name;g('tb-title').textContent=name;document.title=name;toast('✅ 已更新','ok');};}
async function renderChips(key,title){await loadConfig();var items=key==='dispatch_types'?CONFIG.dispatch_types:CONFIG.vehicle_types;g('stg-content').innerHTML='<div class="card"><div class="card-hdr"><span class="card-title">'+title+'</span></div><div class="card-body"><p style="font-size:12px;color:var(--g500);margin-bottom:12px">申請表中的選項</p><div class="chip-wrap">'+items.map(function(t,i){return '<div class="chip">'+t+'<button class="chip-x" data-chip-key="'+key+'" data-chip-idx="'+i+'">✕</button></div>';}).join('')+'</div><div class="chip-add"><input class="ffi" style="padding-left:12px" id="chip-input" placeholder="新增選項"><button class="btn btn-p" id="add-chip-btn">＋ 新增</button></div></div></div>';document.querySelectorAll('.chip-x').forEach(function(btn){btn.onclick=async function(){var arr=(key==='dispatch_types'?CONFIG.dispatch_types:CONFIG.vehicle_types).slice();arr.splice(parseInt(btn.dataset.chipIdx),1);await sb.from('system_config').upsert({key:key,value:JSON.stringify(arr)});if(key==='dispatch_types')CONFIG.dispatch_types=arr;else CONFIG.vehicle_types=arr;toast('已刪除');renderChips(key,title);buildForm();};});g('add-chip-btn').onclick=async function(){var v=g('chip-input').value.trim();if(!v){toast('請輸入','err');return;}var arr=(key==='dispatch_types'?CONFIG.dispatch_types:CONFIG.vehicle_types).concat([v]);await sb.from('system_config').upsert({key:key,value:JSON.stringify(arr)});if(key==='dispatch_types')CONFIG.dispatch_types=arr;else CONFIG.vehicle_types=arr;toast('✅','ok');renderChips(key,title);buildForm();};}
function renderEmailSettings(){g('stg-content').innerHTML='<div class="card"><div class="card-hdr"><span class="card-title">📧 郵件通知設定</span></div><div class="card-body"><div style="background:var(--pbg);border:1px solid #bfdbfe;border-radius:var(--r);padding:12px;margin-bottom:16px;font-size:12px;color:var(--p)">使用 <strong>EmailJS</strong>（免費，每月200封）到 <a href="https://emailjs.com" target="_blank" style="color:var(--p)">emailjs.com</a> 免費註冊後填入</div><div class="fg2"><div class="ff"><label>Service ID</label><input class="ffi" id="em-sid" value="'+EMAIL_CFG.service_id+'" placeholder="service_xxx"></div><div class="ff"><label>Template ID</label><input class="ffi" id="em-tid" value="'+EMAIL_CFG.template_id+'" placeholder="template_xxx"></div><div class="ff"><label>Public Key</label><input class="ffi" id="em-pk" value="'+EMAIL_CFG.public_key+'" placeholder="xxxxx"></div><div class="ff"><label>管理員 Email</label><input class="ffi" id="em-admin" value="'+EMAIL_CFG.admin_email+'" placeholder="admin@company.com"></div></div><button class="btn btn-p" id="save-email-btn">💾 儲存</button><button class="btn btn-ghost" style="margin-left:8px" id="test-email-btn">📧 測試</button></div></div>';g('save-email-btn').onclick=async function(){EMAIL_CFG={service_id:g('em-sid').value.trim(),template_id:g('em-tid').value.trim(),public_key:g('em-pk').value.trim(),admin_email:g('em-admin').value.trim()};await sb.from('system_config').upsert({key:'email_cfg',value:JSON.stringify(EMAIL_CFG)});toast('✅ 已儲存','ok');};g('test-email-btn').onclick=async function(){if(!EMAIL_CFG.admin_email){toast('請填寫管理員 Email','err');return;}var ok=await sendEmail(EMAIL_CFG.admin_email,'測試郵件','這是測試郵件！');toast(ok?'✅ 已發送！':'❌ 發送失敗',ok?'ok':'err');};}
function renderTelegramSettings(){g('stg-content').innerHTML='<div class="card"><div class="card-hdr"><span class="card-title">✈️ Telegram 通知設定</span></div><div class="card-body"><div style="background:var(--pbg);border:1px solid #bfdbfe;border-radius:var(--r);padding:12px;margin-bottom:16px;font-size:12px;color:var(--p)">申請提交、核准、拒絕、完成、刪除 皆自動通知 Telegram 群組</div><div class="fg2"><div class="ff"><label>Bot Token</label><input class="ffi" id="tg-token" value="'+TG_BOT_TOKEN+'" placeholder="123456:AAF-xxx"></div><div class="ff"><label>群組 ID</label><input class="ffi" id="tg-group" value="'+TG_GROUP_ID+'" placeholder="-1001234567890"></div></div><button class="btn btn-p" id="save-tg-btn">💾 儲存</button><button class="btn btn-ghost" style="margin-left:8px" id="test-tg-btn">📨 測試發送</button></div></div>';g('save-tg-btn').onclick=async function(){TG_BOT_TOKEN=g('tg-token').value.trim();TG_GROUP_ID=g('tg-group').value.trim();await sb.from('system_config').upsert({key:'tg_cfg',value:JSON.stringify({token:TG_BOT_TOKEN,group_id:TG_GROUP_ID})});toast('✅ 已儲存','ok');};g('test-tg-btn').onclick=async function(){await sendTelegram('✅ 測試訊息 - 三盛派車系統連線正常！');toast('✅ 測試訊息已發送','ok');};}
function renderFuelSettings(){g('stg-content').innerHTML='<div class="card"><div class="card-hdr"><span class="card-title">⛽ 油價設定</span></div><div class="card-body"><div style="background:var(--warnbg);border:1px solid #fcd34d;border-radius:var(--r);padding:12px;margin-bottom:16px;font-size:12px;color:#92400e">目前油價: <strong>$'+FUEL_PRICE+' USD/升</strong><br>用於計算每趟油耗費用（公里數 ÷ 油耗 × 油價）</div><div class="ff" style="max-width:200px"><label>柬埔寨油價（USD/升）</label><input type="number" class="ffi" id="fp-price" value="'+FUEL_PRICE+'" min="0.5" max="5" step="0.01" placeholder="1.20"></div><button class="btn btn-p" id="save-fp-btn">💾 更新油價</button></div></div>';g('save-fp-btn').onclick=async function(){var p=parseFloat(g('fp-price').value);if(!p||p<=0){toast('請輸入有效油價','err');return;}await sb.from('fuel_price').insert({price_usd:p,updated_by:CU.name});FUEL_PRICE=p;toast('✅ 油價已更新為 $'+p+' USD/升','ok');renderFuelSettings();};}
async function exportCSV(){var r=await sb.from('dispatch_requests').select('*,users!requester_id(name,phone)').order('created_at',{ascending:false});if(!r.data||!r.data.length){toast('沒有資料','err');return;}var rows=[['編號','日期','時間','申請人','電話','種類','車輛','出發地','目的地','人數','原因','出廠km','回廠km','行駛km','狀態','申請時間']];r.data.forEach(function(rec){var types='';try{types=JSON.parse(rec.dispatch_types).join('+');}catch(e){types=rec.dispatch_types;}rows.push([rec.request_no,rec.dispatch_date,rec.dispatch_time,rec.users?rec.users.name:'',rec.users?rec.users.phone||'':'',types,rec.vehicle_type||'',rec.start_location,rec.destination,rec.passengers,(rec.reason||'').replace(/,/g,'，'),rec.km_out||'',rec.km_in||'',rec.km_driven||'',rec.status,rec.created_at?rec.created_at.slice(0,16):'']);});var csv='\uFEFF'+rows.map(function(row){return row.map(function(c){return '"'+c+'"';}).join(',');}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='派車紀錄_'+todayStr()+'.csv';a.click();toast('✅ CSV 已匯出','ok');}
function initSupabase(){if(typeof window.supabase==='undefined'){setTimeout(initSupabase,100);return;}sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);curLang=sessionStorage.getItem('lang')||'zh';setLang(curLang);g('rt-admin').onclick=function(){setRole('admin');};g('rt-user').onclick=function(){setRole('user');};g('lbtn').onclick=doLogin;g('lu').addEventListener('keydown',function(e){if(e.key==='Enter')g('lp').focus();});g('lp').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});g('logout-btn').onclick=doLogout;g('reset-btn')&&(g('reset-btn').onclick=resetForm);g('submit-btn')&&(g('submit-btn').onclick=submitApply);g('refresh-recent-btn')&&(g('refresh-recent-btn').onclick=loadRecent);g('export-btn')&&(g('export-btn').onclick=exportCSV);g('refresh-rec-btn')&&(g('refresh-rec-btn').onclick=loadRecords);g('clear-filter-btn')&&(g('clear-filter-btn').onclick=clearFilters);g('s-q')&&(g('s-q').oninput=function(){recPage=1;loadRecords();});g('s-status')&&(g('s-status').onchange=function(){recPage=1;loadRecords();});g('s-from')&&(g('s-from').onchange=function(){recPage=1;loadRecords();});g('s-to')&&(g('s-to').onchange=function(){recPage=1;loadRecords();});g('view-all-btn')&&(g('view-all-btn').onclick=function(){goPage('records');});g('new-apply-btn')&&(g('new-apply-btn').onclick=function(){goPage('apply');});g('add-veh-btn')&&(g('add-veh-btn').onclick=function(){showVehForm(null);});g('rpt-load-btn')&&(g('rpt-load-btn').onclick=renderReport);g('rpt-export-btn')&&(g('rpt-export-btn').onclick=exportReport);g('dash-veh-refresh')&&(g('dash-veh-refresh').onclick=loadDashVehicles);['lb-zh','lb-en','lb-km'].forEach(function(id){g(id)&&(g(id).onclick=function(){setLang(g(id).dataset.lang);});});var saved=sessionStorage.getItem('cu');if(saved){try{CU=JSON.parse(saved);initApp();}catch(e){sessionStorage.removeItem('cu');}}}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initSupabase);}else{initSupabase();}
})();
</script>
